<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body style="background-color: black; color: aliceblue">
    <h2>Web Sockets Demo</h2>
    <button id="connect-socket">Upgrade to Socket</button>
    <div style="margin: 6px 0">
      <input
        id="message"
        type="text"
        placeholder="Enter message"
        style="padding: 3px; width: auto"
      />
      <button
        id="send-message"
        style="background-color: chartreuse; padding: 3px"
      >
        Send Message
      </button>
      <p id="para-text" style="color: red"></p>
    </div>

    <div style="margin-top: 10px">
      <h2>Received Messages</h2>
      <ul id="messages-list"></ul>
    </div>

    <script>
      const socketConnectButton = document.getElementById("connect-socket");
      const sendMessageButton = document.getElementById("send-message");
      const messageInput = document.getElementById("message");
      const messagesList = document.getElementById("messages-list");
      const paraText = document.getElementById("para-text");

      let connection = null;

      socketConnectButton.addEventListener("click", () => {
        const { port } = window.location;

        // close if there is any open connection first
        if(connection) {
            connection.close();
        }

        connection = new WebSocket(`ws://localhost:${port}`);

        connection.onopen = () => {
          console.log("WebSocket connected");
          paraText.innerText = "Connected!";
          paraText.style.color = "green";
        };

        connection.onmessage = (event) => {
          console.log("Message received:", event.data);

          const li = document.createElement("li");
          li.innerText = event.data;

          messagesList.appendChild(li);
        };

        connection.onerror = (error) => {
          console.error("WebSocket error:", error);
        };

        connection.onclose = () => {
          console.log("WebSocket disconnected");
          paraText.innerText = "WebSocket disconnected";
          paraText.style.color = "red";
        };
      });

      sendMessageButton.addEventListener("click", () => {
        if (!connection) {
          paraText.innerText =
            "Please upgrade the connection to web sockets first";
          return;
        }

        if (connection.readyState !== WebSocket.OPEN) {
          paraText.innerText = "WebSocket is not connected yet";
          return;
        }

        paraText.innerText = "";

        connection.send(messageInput.value);
        messageInput.value = "";
      });
    </script>
  </body>
</html>
